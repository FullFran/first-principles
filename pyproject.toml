[project]
name = "first-principles"
version = "0"
description = "Minimal implementations, rebuilt from the equations."
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8"]
site = [
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pygments>=2.21.0",
]

# Not a package. This repo is read, not installed.
[tool.uv]
package = false
